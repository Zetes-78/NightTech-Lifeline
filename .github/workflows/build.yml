name: Build Night Tech Lifeline

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup --version 6.7.1 --no-progress -y

      # Runs the core tests first, then publishes and builds the installer.
      - name: Build the installer
        shell: pwsh
        run: ./build.ps1

      # The website's button points at releases/latest/download/NightTechLifeline-Setup.exe, so keep that exact name too.
      - name: Name the download
        shell: pwsh
        run: |
          $v = (Select-Xml -Path src\NightTech.Lifeline\NightTech.Lifeline.csproj -XPath '//Version').Node.InnerText
          Copy-Item "dist\NightTechLifeline-Setup-$v.exe" dist\NightTechLifeline-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: NightTechLifeline-installer
          path: |
            dist/NightTechLifeline-Setup*.exe
            dist/NightTechLifeline-Setup*.sha256.txt

      - name: Attach the installer to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NightTechLifeline-Setup.exe
            dist/NightTechLifeline-Setup-*.exe.sha256.txt
